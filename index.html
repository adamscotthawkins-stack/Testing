function preset(){if(!RC){RC=true;draw();return}RC=false;delete S.plan;applyPlan();S.pe=false;save();draw();toast('Plan reset to the default')}
function planEditor(d){const x=PLAN[d],rest=x.n==='Rest day';return `<div class="card"><div class="ed-head"><div class="eyebrow">Editing ${DAYS[d]}</div><button class="btn sm" onclick="pedit(false)">Done</button></div>
${rest?`<h2 style="margin-top:12px">Rest day</h2><div class="mu">${esc(x.f)}</div>`:`<div class="field"><label for="pn">Session name</label><input id="pn" type="text" value="${esc(x.n)}" onchange="pset(${d},'n',this.value)"></div><div class="field"><label for="pf">Focus</label><input id="pf" type="text" value="${esc(x.f)}" onchange="pset(${d},'f',this.value)"></div>

/* ---------- fix or delete a set ---------- */
function es(ni,j){const n=NK[ni],x=(S.log[n]||[])[j];if(!x)return;SH={n:n,j:j,del:false};const el=document.getElementById('sheet');el.innerHTML=`<div class="sheet-bg" onclick="shx()"></div><div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="eyebrow">${fmtD(x.d)}</div><h2 id="shT" style="margin:4px 0 14px">${esc(n)}</h2><div class="sheet-in"><div class="field" style="margin:0"><label for="shw">${isDB(n)?'Weight of each dumbbell (kg)':'Weight (kg)'}</label><input id="shw" type="number" step="0.5" inputmode="decimal" value="${x.w}"></div><div class="field" style="margin:0"><label for="shr">Reps</label><input id="shr" type="number" inputmode="numeric" value="${x.r}"></div><div class="field" style="margin:0"><label for="shq">RIR</label><select id="shq"><option value="">–</option>${[0,1,2,3,4].map(v=>`<option value="${v}" ${x.q===v?'selected':''}>${v===4?'4+':v}</option>`).join('')}</select></div></div><div class="sheet-act"><button class="btn danger-ghost" id="shd" onclick="shd()">Delete set</button><button class="btn" onclick="shs()">Save</button></div><button class="link" style="width:100%;margin-top:8px" onclick="shx()">Cancel</button></div>`;el.hidden=false}
function shx(){SH=null;const el=document.getElementById('sheet');el.hidden=true;el.innerHTML=''}
function shs(){if(!SH)return;const w=parseFloat(document.getElementById('shw').value),r=parseInt(document.getElementById('shr').value);if(!(w>=0)||!(r>0)){toast('Enter a weight and at least 1 rep.');return}const x=S.log[SH.n][SH.j],qv=document.getElementById('shq').value;x.w=w;x.r=r;if(qv==='')delete x.q;else x.q=+qv;save();shx();draw();toast('Set updated')}
function shd(){if(!SH)return;if(!SH.del){SH.del=true;const b=document.getElementById('shd');b.textContent='Tap again to delete';b.classList.add('armed');return}S.log[SH.n].splice(SH.j,1);if(!S.log[SH.n].length)delete S.log[SH.n];save();shx();draw();toast('Set deleted')}

function swPicker(i){const cat={Breakfast:'Breakfast',Lunch:'Lunch',Snack:'Snacks and shakes',Dinner:'Dinner',Evening:'Snacks and shakes'}[MEALS[i].n],cur=S.swap&&S.swap[today+'-'+i],idx=RECIPES.map((r,j)=>j).sort((a,b)=>(RECIPES[b].w===cat)-(RECIPES[a].w===cat));
return `<div class="picker">${cur!=null?`<button class="pk" onclick="swp(${i},-1)"><span class="t"><b>Back to original</b><br><span class="mu sm">${esc(MEALS[i].i)}</span></span><span class="r">${Math.round(MEALS[i].k*sc())} kcal<br>${Math.round(MEALS[i].p*sc())}g P</span></button>`:''}${idx.filter(j=>j!==cur).map(j=>{const r=RECIPES[j];return `<button class="pk" onclick="swp(${i},${j})"><span class="t"><b>${r.n}</b><br><span class="mu sm">${r.w} · ${r.t}</span></span><span class="r">${Math.round(r.k*sc())} kcal<br>${Math.round(r.p*sc())}g P</span></button>`}).join('')}</div>`}
function swp(i,j){S.swap=S.swap||{};const k=today+'-'+i;if(j<0)delete S.swap[k];else S.swap[k]=j;SW=null;save();draw();toast(j<0?MEALS[i].n+' is back to the original':MEALS[i].n+' swapped for '+RECIPES[j].n)}

/* ---------- photos (stored on this phone, in IndexedDB) ---------- */
const PURL={};let PDBp=null;
function pdb(){return PDBp=PDBp||new Promise((ok,no)=>{try{const r=indexedDB.open('fit-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function pop(m,fn){return pdb().then(db=>new Promise((ok,no)=>{const t=db.transaction('p',m),q=fn(t.objectStore('p'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)}))}
function d2b(u){const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}
function b2d(b){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ok(null);r.readAsDataURL(b)})}
const pid=()=>'p'+Date.now()+Math.random().toString(36).slice(2,6);
/* move any photos held inline (from a restored backup) into IndexedDB; drop old claude.ai-only photo links */
async function photosToDb(){let ch=false;const n=(S.photos||[]).length;S.photos=(S.photos||[]).filter(p=>p.i||p.k);if(S.photos.length!==n)ch=true;for(const p of S.photos){if(p.i&&!p.k){try{const id=pid(),b=d2b(p.i);await pop('readwrite',s=>s.put(b,id));p.k=id;PURL[id]=URL.createObjectURL(b);delete p.i;ch=true}catch(e){break}}}if(ch){save();draw()}}
async function loadPhotos(){let n=0;for(const p of S.photos||[]){if(p.k&&!PURL[p.k]){try{const b=await pop('readonly',s=>s.get(p.k));if(b){PURL[p.k]=URL.createObjectURL(b);n++}}catch(e){}}}if(n)draw()}
function addP(inp){const f=inp.files&&inp.files[0];if(!f)return;inp.value='';const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
c.toBlob(b=>{if(!b){toast('That photo could not be read. Try another one.');return}const id=pid();pop('readwrite',s=>s.put(b,id)).then(()=>{PURL[id]=URL.createObjectURL(b);S.photos.push({d:today,k:id});save();draw();toast('Photo saved')}).catch(()=>{const c2=document.createElement('canvas'),k=Math.min(1,320/c.width);c2.width=Math.round(c.width*k);c2.height=Math.round(c.height*k);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);S.photos.push({d:today,i:c2.toDataURL('image/jpeg',.6)});save();draw();toast('Photo saved (small copy)')})},'image/jpeg',.82)};im.onerror=()=>toast('That file is not a photo this phone can read.');im.src=r.result};r.readAsDataURL(f)}
function phd(i){if(PD!==i){PD=i;draw();return}const p=S.photos[i];PD=null;S.photos.splice(i,1);save();draw();if(p&&p.k){pop('readwrite',s=>s.delete(p.k)).catch(()=>{});if(PURL[p.k])URL.revokeObjectURL(PURL[p.k]);delete PURL[p.k]}}
function photoCard(){const P=S.photos||[],src=p=>p.k?(PURL[p.k]||''):p.i;
return `<div class="card"><div class="ed-head"><h2>Progress photos</h2><label class="btn sm" for="pup">Add photo</label></div><input id="pup" class="vh" type="file" accept="image/*" onchange="addP(this)">
${P.length>=2?`<div class="cmp"><figure><img src="${src(P[0])}" alt="First progress photo, ${fmtD(P[0].d)}"><figcaption>First · ${fmtD(P[0].d)}</figcaption></figure><figure><img src="${src(P[P.length-1])}" alt="Latest progress photo, ${fmtD(P[P.length-1].d)}"><figcaption>Latest · ${fmtD(P[P.length-1].d)}</figcaption></figure></div>`:''}
${P.length?`<div class="pgrid">${P.map((p,i)=>`<div class="ph"><img src="${src(p)}" alt="Progress photo, ${fmtD(p.d)}" loading="lazy"><span>${fmtD(p.d)}</span><button class="ph-x ${PD===i?'armed':''}" onclick="phd(${i})" aria-label="Delete photo">${PD===i?'Delete?':ICO.x}</button></div>`).join('')}</div>`:`<div class="empty">Take a photo every few weeks in the same spot and light. Your first and latest will sit side by side here.</div>`}
<div class="mu sm" style="margin-top:10px">Photos are saved on this phone and included in your backups.</div></div>`}

/* ---------- charts ---------- */
function nice(mn,mx,n){const sp=(mx-mn)||1,raw=sp/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,st=(f<1.5?1:f<3?2:f<7?5:10)*mag,lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st,t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(Math.round(v*100)/100);return t}
function tip(id,i){const el=document.getElementById(id+'-cap');if(el&&TIP[id])el.innerHTML=TIP[id][i]}
function lineChart(id,pts,o){o=o||{};if(pts.length<2)return `<div class="empty">${o.empty||'Not enough data yet.'}</div>`;
const W=340,H=180,L=36,R=18,T=18,B=26,ts=d=>new Date(d+'T12:00').getTime();
const vs=pts.map(p=>p.v);if(o.ref!=null)vs.push(o.ref);const mn=Math.min(...vs),mx=Math.max(...vs),pd=(mx-mn)*.1||1,tk=nice(mn-pd,mx+pd,3),lo=tk[0],hi=tk[tk.length-1];
const t0=ts(pts[0].d),t1=Math.max(ts(o.x1||pts[pts.length-1].d),t0+864e5);
const X=d=>L+(ts(d)-t0)/(t1-t0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
const xy=pts.map(p=>[X(p.d),Y(p.v)]),line=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' '),area=line+` L${xy[xy.length-1][0].toFixed(1)} ${Y(lo).toFixed(1)} L${xy[0][0].toFixed(1)} ${Y(lo).toFixed(1)} Z`,last=pts[pts.length-1],lq=xy[xy.length-1];
TIP[id]=pts.map(p=>`<b>${fmtD(p.d)}</b> · ${p.v} ${o.unit||''}${p.s?' · '+p.s:''}${p.pr?' <span class="pill up">PR</span>':''}`);
let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||'Chart'}">`;
s+=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${+v.toFixed(1)}</text>`).join('');
if(o.ref!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.ref).toFixed(1)}" y2="${Y(o.ref).toFixed(1)}" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="4 4" opacity=".5"/><text x="${L+4}" y="${(Y(o.ref)-6).toFixed(1)}" class="ax strong">${o.refLab}</text>`;
s+=`<path d="${area}" fill="var(--accent)" fill-opacity=".12"/>`;
if(o.proj)s+=`<path d="M${X(o.proj[0].d).toFixed(1)} ${Y(o.proj[0].v).toFixed(1)} L${X(o.proj[1].d).toFixed(1)} ${Y(o.proj[1].v).toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 5" fill="none" stroke-linecap="round"/><circle cx="${X(o.proj[1].d).toFixed(1)}" cy="${Y(o.proj[1].v).toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`;
s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
s+=xy.map((q,i)=>pts[i].pr?`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('');
s+=`<text x="${Math.min(lq[0],W-R).toFixed(1)}" y="${Math.max(lq[1]-11,12).toFixed(1)}" text-anchor="${lq[0]>W-70?'end':'middle'}" class="ax val">${last.v}</text>`;
s+=`<text x="${L}" y="${H-6}" class="ax">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" class="ax">${o.x1?fmtD(o.x1)+' goal':fmtD(last.d)}</text>`;

function rgChips(){const c=S.rg==null?12:S.rg;return `<div class="seg sm" role="group" aria-label="Time range">${[[4,'4 weeks'],[12,'12 weeks'],[0,'All time']].map(r=>`<button class="${c===r[0]?'on':''}" aria-pressed="${c===r[0]}" onclick="S.rg=${r[0]};save();draw()">${r[1]}</button>`).join('')}</div>`}

/* ---------- progress: overview ---------- */
function dayStats(){const m={};for(const n in S.log)S.log[n].forEach((x,j)=>{const q=m[x.d]=m[x.d]||{sets:0,t:0,l:{}};q.sets++;q.t+=x.w*x.r*(isDB(n)?2:1);(q.l[n]=q.l[n]||[]).push(j)});
for(const k in S.done){if(!S.done[k])continue;const q=k.match(/^x(\d{4}-\d\d-\d\d)-(\d)-/);if(q&&PLAN[+q[2]]&&PLAN[+q[2]].n!=='Rest day'){const d=addDays(q[1],+q[2]);(m[d]=m[d]||{sets:0,t:0,l:{}}).tick=1}}return m}
function benchPts(){const m={};Object.keys(S.log).filter(n=>/^Bench press/i.test(n)).forEach(n=>S.log[n].forEach(x=>{const v=e1(x.w,x.r,x.q);if(!m[x.d]||v>m[x.d].v)m[x.d]={v:v,s:x.w+kg(n)+' × '+x.r}}));S.benches.forEach(x=>{if(!m[x.d]||x.w>m[x.d].v)m[x.d]={v:x.w,s:'tested 1RM'}});return Object.keys(m).sort().map(d=>({d:d,v:Math.round(m[d].v*10)/10,s:m[d].s}))}
function trend(pts){const P=pts.filter(p=>p.d>=addDays(today,-42));if(P.length<3)return null;const t0=new Date(P[0].d+'T12:00'),x=P.map(p=>(new Date(p.d+'T12:00')-t0)/864e5),y=P.map(p=>p.v),n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n,sxx=x.reduce((a,v)=>a+(v-mx)**2,0);if(x[n-1]-x[0]<21)return null;const k=Math.max(-2.5/7,Math.min(2.5/7,x.reduce((a,v,i)=>a+(v-mx)*(y[i]-my),0)/sxx));return {k:k*7,at:d=>my+k*((new Date(d+'T12:00')-t0)/864e5-mx)}}
function benchCard(){const pts=benchPts(),rec=pts.filter(p=>p.d>=addDays(today,-28)),best=(rec.length?rec:pts).length?Math.max(...(rec.length?rec:pts).map(p=>p.v)):0,b1=Math.round(best*2)/2,xmas=now.getFullYear()+'-12-25',days=Math.max(0,Math.ceil(dd(today,xmas))),need=b1&&b1<100?(100-b1)/Math.max(1,days/7):0,lp=pts[pts.length-1],proj=b1&&b1<100&&days>0&&pts.length?[{d:lp.d,v:lp.v},{d:xmas,v:100}]:null;
return `<div class="card"><div class="eyebrow">Goal · 100 kg bench by Christmas</div><div class="big">${b1||'–'}<small> kg</small></div><div class="mu">${b1?'Estimated max (best of last 4 weeks)':'No bench sets logged yet'} · ${days} days left</div>${(()=>{const T=trend(pts);if(!T||b1>=100)return '';const p=Math.round(T.at(xmas)*2)/2;return `<div class="mu" style="margin-top:4px">Current trend: ${T.k>=0?'+':''}${T.k.toFixed(1)} kg a week → about <b style="color:var(--ink)">${p} kg</b> by Christmas ${p>=100?'<span class="pill up">On track</span>':'<span class="pill down">Behind</span>'}</div>`})()}<div class="bar"><i style="width:${Math.min(100,b1)}%"></i></div>${need?`<div class="mu">Add ${need.toFixed(1)} kg a week · next target ${(b1+need).toFixed(1)} kg ${need>2.5?'<span class="pill down">Stretch</span>':'<span class="pill up">Doable</span>'}</div>`:b1>=100?'<span class="pill up">Goal reached</span>':''}
${pts.length>=2?lineChart('bc',pts,{ref:100,refLab:'100 kg goal',proj:proj,x1:proj?xmas:null,unit:'kg',aria:'Bench estimated max against the 100 kg goal',cap:'Dotted line shows the pace you need. Tap a point for details.'}):''}
<div class="row-in"><input id="b" type="number" step="0.5" inputmode="decimal" placeholder="Tested 1RM (kg)"><button class="btn" onclick="addB()">Log 1RM</button></div><div class="mu sm" style="margin-top:6px">Bench sets from your workouts count automatically as an estimated max.</div></div>`}

if(!wks.some(w=>w.v))return `<div class="card"><h2>Weekly volume</h2><div class="empty">Log sets with weights and your weekly total shows up here.</div></div>`;
const W=340,H=170,L=4,R=4,T=22,B=24,n=wks.length,g=8,bw=(W-L-R-g*(n-1))/n,mx=Math.max(...wks.map(w=>w.v),1),Yh=v=>(H-T-B)*v/mx,hiI=wks.reduce((m,w,i)=>w.v>wks[m].v?i:m,0);

if((cur||i===hiI)&&w.v)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" class="ax val">${fmtTp(w.v)}</text>`;
const dt=new Date(w.d+'T12:00');s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" class="ax">${cur?'Now':dt.getDate()+'/'+(dt.getMonth()+1)}</text><rect x="${(x-g/2).toFixed(1)}" y="${T}" width="${(bw+g).toFixed(1)}" height="${H-T}" fill="transparent" class="hit" onclick="tip('tn',${i})"><title>${fmtTp(w.v)}</title></rect>`});

async function cpcsv(){const r=rowsSets(),h=['Date','Exercise','Weight (kg)','Reps','RIR','Est. max (kg)'],q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;try{await navigator.clipboard.writeText([h.join(',')].concat(r.map(x=>h.map(k=>q(x[k])).join(','))).join('\n'));toast('Copied '+r.length+' sets. Paste into Google Sheets or Excel.')}catch(e){toast('Copying isn’t allowed here.')}}
function rs(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!(o.log||o.weights||o.plan))throw 0;RS=o;draw()}catch(e){toast('That file isn’t a Fitness Dashboard backup.')}};r.readAsText(f)}
function rsGo(ok){if(ok&&RS){const t=S.tab;delete RS._backup;S=Object.assign({done:{},water:{},meals:{},goal:'bulk',weights:[],benches:[],log:{},foods:{},meas:[],photos:[],habits:{},shop:{},sel:null},RS,{tab:t});applyPlan();rollNotes();save();toast('Backup restored');photosToDb()}RS=null;draw()}
function dataCard(){const n=Object.values(S.log).reduce((a,l)=>a+l.length,0);return `<div class="card"><h2>Your data</h2><div class="mu sm">${n} sets, ${S.weights.length} weigh-ins. Open your log in Excel or Google Sheets, or keep a backup you can restore.</div><div style="display:grid;gap:8px;margin-top:12px">${DLS?`<button class="btn" onclick="xl()">Export spreadsheet (.xlsx)</button><button class="btn ghost" onclick="bk()">Download backup</button>`:`<button class="btn" onclick="cpcsv()">Copy sets as CSV</button>`}<label class="btn ghost" for="rsf" style="justify-content:center">Restore from backup</label><input id="rsf" class="vh" type="file" accept=".json,application/json" onchange="rs(this)"></div>${RS?`<div class="card dlb" style="margin:12px 0 0;box-shadow:none"><b>Replace everything with this backup?</b><div class="mu sm">${RS._backup?'Saved '+fmtD(RS._backup)+' · ':''}${Object.values(RS.log||{}).reduce((a,l)=>a+l.length,0)} sets. Your current data will be overwritten.</div><div class="sheet-act" style="margin-top:10px"><button class="btn ghost" onclick="rsGo(false)">Cancel</button><button class="btn danger" onclick="rsGo(true)">Replace</button></div></div>`:''}</div>`}
